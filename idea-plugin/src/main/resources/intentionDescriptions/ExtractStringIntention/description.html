<body>
Moves a string in Compose UI code into the module's <code>composeResources/values/strings.xml</code> and replaces it
with <code>stringResource(Res.string.…)</code>. String templates become placeholders: <code>"Hi $name"</code> is
saved as <code>Hi %1$s</code> and called as <code>stringResource(Res.string.hi, name)</code>.
</body>
