Reports text passed straight to Compose UI calls, such as <code>Text("Hello")</code> or <code>label = "Name"</code>,
that isn't in <code>composeResources</code> and so can't be translated. Run it with <b>Code | Inspect Code</b> to
extract all of them at once; each key is named from its text.
