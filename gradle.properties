translationshub.version=0.2.0

# Shown on JetBrains Marketplace.
translationshub.vendorName=Khubaib Khan
translationshub.vendorUrl=https://github.com/KhubaibKhan4/kmp-translations-hub

# IDE the plugin compiles against when no local one is configured (CI). Set a local IDE in the
# git-ignored local.properties instead: translationshub.ideaLocalPath=/Applications/Android Studio.app
translationshub.ciPlatformVersion=2025.3

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.code.style=official
# Paid plan (used only with -Ptranslationshub.productCode). JetBrains' rules: release-date is the major release's date
# (YYYYMMDD); release-version is an integer of at least 2 digits whose last digit is the minor version, matching
# translationshub.version (1.0.x -> 10). Change both only for a new major/minor release: it resets trials.
translationshub.releaseDate=20261201
translationshub.releaseVersion=10
