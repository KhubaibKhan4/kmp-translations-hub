name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verifyRecommended:
        description: Also run the Plugin Verifier against JetBrains' recommended IDEs (downloads several GB)
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Verify plugin against recommended IDEs
        if: ${{ inputs.verifyRecommended }}
        run: ./gradlew :idea-plugin:verifyPlugin -Ptranslationshub.verifyRecommended=true

      - uses: actions/upload-artifact@v4
        with:
          name: kmp-translations-hub-plugin
          path: idea-plugin/build/distributions/*.zip
